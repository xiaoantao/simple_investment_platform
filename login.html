<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>校园投资平台 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0e2e, #1a1f4e, #0d1240);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* 动态背景 */
    canvas#bg { position: fixed; top: 0; left: 0; z-index: 0; }
    .login-card {
      position: relative; z-index: 1;
      width: 400px; padding: 40px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-card h2 { color: #fff; text-align: center; margin-bottom: 8px; font-size: 24px; }
    .login-card .subtitle { color: rgba(255,255,255,0.5); text-align: center; margin-bottom: 32px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: rgba(255,255,255,0.8); margin-bottom: 8px; font-size: 14px; }
    .form-group input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px; color: #fff; font-size: 14px;
      outline: none; transition: border 0.3s;
    }
    .form-group input:focus { border-color: #64b4ff; }
    .form-group input::placeholder { color: rgba(255,255,255,0.3); }
    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #64b4ff, #5a7fff);
      border: none; border-radius: 10px;
      color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(100,180,255,0.4); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .hint { margin-top: 16px; text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; }
    .toast {
      position: fixed; top: 20px; right: 20px; z-index: 999;
      padding: 12px 24px; border-radius: 8px; color: #fff; font-size: 14px;
      transform: translateX(400px); transition: transform 0.3s;
    }
    .toast.show { transform: translateX(0); }
    .toast.success { background: #28a745; }
    .toast.error { background: #dc3545; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="login-card">
    <h2>📊 校园投资平台</h2>
    <p class="subtitle">交易与分析数据平台</p>
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" value="test" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" value="123456" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
    </form>
    <p class="hint">测试账号：test / 123456</p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== 动态背景（复用你之前的炫酷效果） ==========
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const particles = [];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
        r: Math.random() * 2 + 1
      });
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(100, 180, 255, 0.6)';
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();

    // ========== 登录逻辑（核心：和 FastAPI 联调） ==========
    const API_BASE = 'http://127.0.0.1:8002';  // FastAPI 默认地址

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '登录中...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.code === 200) {
          // 登录成功：存 token，跳转
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showToast('登录成功，正在跳转...', 'success');
          setTimeout(() => {
            window.location.href = 'shift_page.html';  // 跳转到平台主页
          }, 1000);
        } else {
          showToast(data.detail || '登录失败', 'error');
        }
      } catch (err) {
        showToast('无法连接服务器，请确认后端已启动', 'error');
      } finally {
        btn.disabled = false; btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
