<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融产品投资管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
            --dark-bg: #1e293b;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.3s;
            box-shadow: var(--shadow);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 子标签页样式 */
        .sub-tabs {
            display: flex;
            gap: 8px;
                margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .sub-tab-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: white;
            transition: all 0.3s;
            position: relative;
        }

        .sub-tab-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.2);
        }

        .sub-tab-btn.active {
            color: white;
            background: rgba(255, 255, 255, 0.25);
        }

        .sub-tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 0;
            right: 0;
            height: 3px;
            background: white;
            border-radius: 2px 2px 0 0;
        }

        .sub-tab-content {
            display: none;
        }

        .sub-tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .card h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color) 0%, #059669 100%);
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            display: block;
        }

        .message.error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            overflow-x: auto;
        }

        .table-container h2 {
            color: var(--primary-color);
                margin-bottom: 20px;
            font-size: 1.5em;
        }

        .table-container.compact h2 {
            margin-bottom: 0;
            font-size: 1.3em;
            }

            table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead tr {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        table thead th {
            color: white;
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        table tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }

        table tbody tr:hover {
            background-color: #f9fafb;
        }

        table tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }

        table tbody tr:nth-child(even):hover {
            background-color: #f3f4f6;
        }

        table td {
            padding: 12px;
            color: var(--text-primary);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
        }

        .chart-card h3 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.3em;
            text-align: center;
        }

        .chart-container {
            position: relative;
            height: 350px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .lists-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .table-container.compact {
            margin: 0;
        }

        .table-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .table-header-row h2 {
            margin: 0;
            border: none;
            padding: 0;
        }

        .refresh-btn-small {
            padding: 6px 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: var(--shadow);
        }

        .refresh-btn-small:hover {
            background: var(--secondary-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .grid,
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 300px;
            }

            .lists-row {
                grid-template-columns: 1fr;
            }

            .sub-tabs {
                gap: 5px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .sub-tab-btn {
                padding: 8px 16px;
                font-size: 13px;
                white-space: nowrap;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 金融产品投资管理系统</h1>
            <p>全面管理客户投资数据，多维度数据分析</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('data')">产品管理</button>
            <button class="tab-btn" onclick="switchTab('borrow_operation')">投资操作</button>
            <button class="tab-btn" onclick="switchTab('analysis')">收益分析</button>
            <button class="tab-btn" onclick="switchTab('borrow')">交易记录</button>
            <button class="tab-btn" onclick="switchTab('lists')">信息列表</button>
        </div>

        <!-- 数据管理标签页 -->
        <div id="data" class="tab-content active">
            <div class="grid">
                <!-- 添加产品 -->
                <div class="card">
                    <h2>💼 添加金融产品</h2>
                    <form id="addProductForm">
                <div class="form-group">
                            <label>产品名称：</label>
                            <input type="text" name="产品名称" required placeholder="例如: 稳健理财A">
                </div>
                <div class="form-group">
                            <label>初始剩余额度：</label>
                            <input type="number" name="剩余额度" min="0" value="0" required placeholder="例如: 1000">
                </div>
                        <div class="form-group">
                            <label>日收益率（%）：</label>
                            <input type="number" name="日收益率" min="0" step="0.01" value="0" placeholder="例如: 0.05 (表示0.05%)">
                            <small style="color: var(--text-secondary); font-size: 12px;">提示：日收益率用于计算投资收益</small>
                        </div>
                        <div class="form-group" id="productIdDisplay" style="display: none;">
                            <label>生成的产品编号：</label>
                            <input type="text" id="generatedProductId" readonly style="background-color: #f3f4f6; color: var(--primary-color); font-weight: bold;">
                        </div>
                        <button type="submit" class="btn">添加产品</button>
                        <div class="message" id="addProductMessage"></div>
            </form>
        </div>

                <!-- 添加客户 -->
                <div class="card">
                    <h2>👤 添加客户</h2>
                    <form id="addCustomerForm">
                        <div class="form-group">
                            <label>客户姓名：</label>
                            <input type="text" name="客户姓名" required placeholder="例如: 张三">
                        </div>
                        <div class="form-group">
                            <label>机构编号：</label>
                            <select name="机构编号" id="customerInstitutionSelect" required>
                                <option value="">请选择机构...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>账号额度（元）：</label>
                            <input type="number" name="账号额度" min="0" step="0.01" value="0" required placeholder="例如: 100000">
                            <small style="color: var(--text-secondary); font-size: 12px;">客户账号的初始可用额度</small>
                        </div>
                        <div class="form-group" id="customerIdDisplay" style="display: none;">
                            <label>生成的客户编号：</label>
                            <input type="text" id="generatedCustomerId" readonly style="background-color: #f3f4f6; color: var(--primary-color); font-weight: bold;">
                        </div>
                        <button type="submit" class="btn btn-success">添加客户</button>
                        <div class="message" id="addCustomerMessage"></div>
                    </form>
                </div>

                <!-- 添加机构 -->
                <div class="card">
                    <h2>🏦 添加金融机构</h2>
                    <form id="addInstitutionForm">
                        <div class="form-group">
                            <label>机构名称：</label>
                            <input type="text" name="机构名称" required placeholder="例如: 招商银行">
                        </div>
                        <div class="form-group" id="institutionIdDisplay" style="display: none;">
                            <label>生成的机构编号：</label>
                            <input type="text" id="generatedInstitutionId" readonly style="background-color: #f3f4f6; color: var(--primary-color); font-weight: bold;">
                        </div>
                        <button type="submit" class="btn" style="background: linear-gradient(135deg, var(--warning-color) 0%, #d97706 100%);">添加机构</button>
                        <div class="message" id="addInstitutionMessage"></div>
                    </form>
                </div>
            </div>
    </div>

        <!-- 投资操作标签页 -->
        <div id="borrow_operation" class="tab-content">
            <div class="sub-tabs">
                <button class="sub-tab-btn active" onclick="switchSubTab('borrow_operation', 'purchase')">💰 购买产品</button>
                <button class="sub-tab-btn" onclick="switchSubTab('borrow_operation', 'holdings')">📊 当前持仓</button>
    </div>

            <!-- 购买产品子标签页 -->
            <div id="borrow_operation_purchase" class="sub-tab-content active">
                <div class="grid">
                    <div class="card">
                        <h2>💰 购买产品 
                            <button type="button" onclick="loadSelectOptions()" style="float: right; padding: 6px 12px; font-size: 12px; background: var(--success-color); color: white; border: none; border-radius: 6px; cursor: pointer;">🔄 刷新列表</button>
                        </h2>
                        <form id="purchaseProductForm">
                            <div class="form-group">
                                <label>选择客户：</label>
                                <select name="客户编号" id="purchaseCustomerSelect" required>
                                    <option value="">请选择客户...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>选择产品：</label>
                                <select name="产品编号" id="purchaseProductSelect" required>
                                    <option value="">请选择产品...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>投资金额（元）：</label>
                                <input type="number" name="投资金额" min="0" step="0.01" value="0" required placeholder="例如: 10000">
                            </div>
                            <div class="form-group">
                                <label>投资期限（天）：</label>
                                <input type="number" name="投资期限" min="1" step="1" value="30" required placeholder="例如: 30">
                                <small style="color: var(--text-secondary); font-size: 12px;">提示：投资期限用于计算收益，赎回时将按此期限计算</small>
                            </div>
                            <button type="submit" class="btn" style="background: linear-gradient(135deg, var(--success-color) 0%, #059669 100%);">💰 购买产品</button>
                            <div class="message" id="purchaseProductMessage"></div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 当前持仓子标签页 -->
            <div id="borrow_operation_holdings" class="sub-tab-content">
                <div class="table-container">
                    <h2>📊 当前持仓中（点击赎回按钮赎回）</h2>
                    <button type="button" onclick="loadCurrentInvestments()" style="margin-bottom: 15px; padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer;">🔄 刷新列表</button>
                    <div id="currentInvestmentsTable"></div>
                </div>
            </div>
        </div>

        <!-- 收益分析标签页 -->
        <div id="analysis" class="tab-content">
            <div class="stats-grid" id="statsGrid"></div>
            
            <div class="charts-grid">
                <div class="chart-card">
                    <h3>📊 按年份投资期限汇总</h3>
                    <div class="chart-container">
                        <canvas id="yearChart"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <h3>🏦 按机构投资情况</h3>
                    <div class="chart-container">
                        <canvas id="institutionChart"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <h3>👥 客户投资排行榜（Top 10）</h3>
                    <div class="chart-container">
                        <canvas id="customerChart"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <h3>💼 热门产品排行榜（Top 10）</h3>
                    <div class="chart-container">
                        <canvas id="productChart"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <h3>📅 按月投资趋势</h3>
                    <div class="chart-container">
                        <canvas id="monthChart"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <h3>📈 机构平均投资期限对比</h3>
                    <div class="chart-container">
                        <canvas id="institutionAvgChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 交易记录标签页 -->
        <div id="borrow" class="tab-content">
            <div class="table-container">
                <h2>📋 完整交易记录</h2>
                <button type="button" onclick="loadFullRecords()" style="margin-bottom: 15px; padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer;">🔄 刷新记录</button>
                <div id="fullRecordsTable"></div>
            </div>
        </div>

        <!-- 信息列表标签页 -->
        <div id="lists" class="tab-content">
            <div class="sub-tabs">
                <button class="sub-tab-btn active" onclick="switchSubTab('lists', 'customers')">👤 客户列表</button>
                <button class="sub-tab-btn" onclick="switchSubTab('lists', 'products')">💼 产品列表</button>
                <button class="sub-tab-btn" onclick="switchSubTab('lists', 'institutions')">🏦 机构列表</button>
            </div>

            <!-- 客户列表子标签页 -->
            <div id="lists_customers" class="sub-tab-content active">
                <div class="table-container">
                    <h2>👤 客户列表信息</h2>
                    <button type="button" onclick="loadCustomersList()" style="margin-bottom: 15px; padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer;">🔄 刷新列表</button>
                    <div id="customersListTable"></div>
                </div>
            </div>

            <!-- 产品列表子标签页 -->
            <div id="lists_products" class="sub-tab-content">
                <div class="table-container">
                    <h2>💼 产品列表信息</h2>
                    <button type="button" onclick="loadProductsList()" style="margin-bottom: 15px; padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer;">🔄 刷新列表</button>
                    <div id="productsListTable"></div>
                </div>
            </div>

            <!-- 机构列表子标签页 -->
            <div id="lists_institutions" class="sub-tab-content">
                <div class="table-container">
                    <h2>🏦 机构列表信息</h2>
                    <button type="button" onclick="loadInstitutionsList()" style="margin-bottom: 15px; padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer;">🔄 刷新列表</button>
                    <div id="institutionsListTable"></div>
                </div>
            </div>
        </div>
    </div>

<script>
        const API_BASE = "http://127.0.0.1:8002";
        let charts = {};

        // 切换标签页
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // 如果切换到分析页面，加载图表
            if (tabName === 'analysis') {
                loadAnalysisData();
            } else if (tabName === 'borrow_operation') {
                // 切换到投资操作页面，默认显示购买产品子tab
                switchSubTab('borrow_operation', 'purchase');
                loadSelectOptions();
            } else if (tabName === 'borrow') {
                loadFullRecords();
            } else if (tabName === 'lists') {
                // 切换到信息列表页面，默认显示客户列表子tab
                switchSubTab('lists', 'customers');
            }
        }

        // 切换子标签页
        function switchSubTab(parentTab, subTabName) {
            // 获取父标签页容器
            const parentContainer = document.getElementById(parentTab);
            if (!parentContainer) return;

            // 隐藏所有子标签页内容
            parentContainer.querySelectorAll('.sub-tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // 移除所有子标签页按钮的active状态
            parentContainer.querySelectorAll('.sub-tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // 显示选中的子标签页内容
            const targetContent = document.getElementById(`${parentTab}_${subTabName}`);
            if (targetContent) {
                targetContent.classList.add('active');
            }

            // 激活对应的子标签页按钮
            const targetBtn = event?.target || parentContainer.querySelector(`.sub-tab-btn[onclick*="${subTabName}"]`);
            if (targetBtn) {
                targetBtn.classList.add('active');
            }

            // 根据子标签页加载相应数据
            if (parentTab === 'borrow_operation') {
                if (subTabName === 'purchase') {
                    loadSelectOptions();
                } else if (subTabName === 'holdings') {
                    loadCurrentInvestments();
                }
            } else if (parentTab === 'lists') {
                if (subTabName === 'customers') {
                    loadCustomersList();
                } else if (subTabName === 'products') {
                    loadProductsList();
                } else if (subTabName === 'institutions') {
                    loadInstitutionsList();
                }
            }
        }
