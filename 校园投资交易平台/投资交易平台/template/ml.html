<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能分析平台 · 金融机器学习</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e17;
      --surface: rgba(18, 24, 34, 0.92);
      --surface-hover: rgba(32, 42, 58, 0.7);
      --border: rgba(99, 179, 237, 0.14);
      --border-bright: rgba(99, 179, 237, 0.28);
      --text: #e8eef4;
      --text-secondary: #7d8fa8;
      --primary: #4d9cff;
      --primary-hover: #6eb0ff;
      --primary-glow: rgba(77, 156, 255, 0.2);
      --accent: #9b6cf7;
      --success: #3fb950;
      --success-dim: rgba(63, 185, 80, 0.15);
      --danger: #f85149;
      --danger-dim: rgba(248, 81, 73, 0.15);
      --radius: 10px;
      --radius-sm: 6px;
      --space-xs: 6px;
      --space-sm: 10px;
      --space-md: 14px;
      --space-lg: 18px;
      --space-xl: 22px;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      --shadow-hover: 0 6px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(99, 179, 237, 0.05);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 100% 60% at 50% -15%, rgba(77, 156, 255, 0.08), transparent 45%),
        radial-gradient(ellipse 70% 40% at 100% 40%, rgba(155, 108, 247, 0.06), transparent 40%);
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-header {
      background: rgba(12, 17, 24, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      backdrop-filter: blur(10px);
    }
    .app-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.5px;
      box-shadow: 0 0 16px var(--primary-glow);
    }
    .app-logo-text {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .app-logo-tag {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-left: 6px;
    }
    .app-badge {
      font-size: 10px;
      padding: 5px 10px;
      background: rgba(77, 156, 255, 0.12);
      color: var(--primary);
      border: 1px solid rgba(77, 156, 255, 0.25);
      border-radius: 999px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 20px 32px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 4px;
    }
    .page-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0 0 20px;
      max-width: 520px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
      backdrop-filter: blur(6px);
    }
    .card:hover {
      box-shadow: var(--shadow-hover);
      border-color: var(--border-bright);
    }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .card-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-num {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, rgba(77, 156, 255, 0.22), rgba(155, 108, 247, 0.18));
      color: var(--primary);
      border: 1px solid rgba(77, 156, 255, 0.25);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.01em;
    }
    .card-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 2px 0 0;
      max-width: 380px;
      line-height: 1.45;
    }
    .card-body {
      padding: 16px 18px;
    }
    .grid .card {
      display: flex;
      flex-direction: column;
    }
    .grid .card .card-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .grid .card .card-body .grid-2 {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .grid .card .card-body .grid-2 .chart-container.chart-short {
      flex: 0 0 180px;
      min-height: 180px;
    }
    .grid .card .card-body .grid-2 #segProfileWrap {
      flex: 1;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .grid .card .card-body .grid-2 #segProfileWrap .table-wrap.scroll-x {
      flex: 1;
      min-height: 0;
      max-width: 100%;
      overflow: auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .toolbar label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .btn {
      border: 0;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: background 0.2s, box-shadow 0.2s, transform 0.05s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #3a85e8);
      color: #fff;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-hover), #5a9eff);
      box-shadow: 0 0 14px var(--primary-glow);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--surface-hover);
      border-color: var(--border-bright);
    }
    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #dc3d36);
      color: #fff;
    }
    .btn-danger:hover {
      box-shadow: 0 0 14px rgba(248, 81, 73, 0.25);
    }

    input, select {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(10, 14, 23, 0.5);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }
    input[type="number"] { width: 72px; }
    select { min-width: 200px; cursor: pointer; }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .kpi-box {
      background: rgba(10, 14, 23, 0.45);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }
    .kpi-box .label {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .kpi-box .value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .table-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-top: 12px;
    }
    .table-wrap.scroll-x {
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }
    .table-wrap.scroll-x > .table-wrap {
      overflow: visible;
      min-width: min-content;
    }
    .table-wrap.scroll-x .table {
      min-width: 800px;
      width: max-content;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .table th {
      background: var(--surface-hover);
      color: var(--text-secondary);
      font-weight: 600;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .table tbody tr:last-child td { border-bottom: 0; }
    .table tbody tr:hover td {
      background: var(--surface-hover);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .chart-container {
      min-height: 240px;
      position: relative;
    }
    .chart-container.chart-short {
      min-height: 180px;
    }
    .grid-2 #segProfileWrap {
      min-width: 0;
      overflow: hidden;
    }
    .grid-2 #segProfileWrap .table-wrap.scroll-x {
      max-width: 100%;
      overflow-x: auto;
    }
    .msg {
      margin-top: 12px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .msg.ok {
      background: var(--success-dim);
      color: var(--success);
      border-color: rgba(63, 185, 80, 0.25);
    }
    .msg.bad {
      background: var(--danger-dim);
      color: var(--danger);
      border-color: rgba(248, 81, 73, 0.25);
    }

    .empty-hint {
      padding: 18px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      background: rgba(10, 14, 23, 0.35);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-logo">
      <div class="app-logo-icon">ML</div>
      <div>
        <span class="app-logo-text">智能分析平台</span>
        <span class="app-logo-tag">金融机器学习</span>
      </div>
    </div>
    <span class="app-badge">异常检测 · 客户分群 · 金额预测</span>
  </header>

  <main class="main">
    <h1 class="page-title">智能分析</h1>
    <p class="page-desc">基于投资与客户数据，提供异常检测、客户分群与金额预测，助力风控与运营决策。</p>

    <div class="grid">
      <section class="card">
        <div class="card-header">
          <div class="card-title-wrap">
            <span class="card-num">1</span>
            <div>
              <h2 class="card-title">异常交易检测</h2>
              <p class="card-sub">基于 Z-Score 识别异常大额或小额投资，支持风控名单与复核。</p>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="toolbar">
            <label>阈值 z</label>
            <input id="zInput" type="number" step="0.5" value="3" />
            <label>条数</label>
            <input id="topInput" type="number" value="20" />
            <button class="btn btn-danger" onclick="loadAnomalies()">执行检测</button>
          </div>
          <div id="anomalyKpi" class="kpi-row"></div>
          <div id="anomalyTableWrap"></div>
          <div id="anomalyMsg" class="msg"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <div class="card-title-wrap">
            <span class="card-num">2</span>
            <div>
              <h2 class="card-title">客户分群</h2>
              <p class="card-sub">按投资次数、总金额、期限、产品数、笔均金额等维度 K-Means 聚类，画像更清晰。</p>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="toolbar">
            <label>分群数 k</label>
            <input id="kInput" type="number" value="3" min="1" />
            <button class="btn btn-primary" onclick="loadSegments()">生成分群</button>
            <button class="btn btn-secondary" onclick="downloadJSON('segments.json', lastSegments)">导出 JSON</button>
          </div>
          <div class="grid-2">
            <div class="chart-container chart-short">
              <canvas id="segChart"></canvas>
            </div>
            <div id="segProfileWrap"></div>
          </div>
          <div id="segMsg" class="msg"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <div class="card-title-wrap">
            <span class="card-num">3</span>
            <div>
              <h2 class="card-title">投资金额预测</h2>
              <p class="card-sub">线性回归分析期限、收益率、账号额度对投资金额的影响，输出系数与 R²。</p>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="toolbar">
            <button class="btn btn-primary" onclick="loadRegression()">训练并查看</button>
            <button class="btn btn-secondary" onclick="downloadJSON('regression.json', lastRegression)">导出 JSON</button>
          </div>
          <div id="regKpi" class="kpi-row"></div>
          <div class="chart-container" style="min-height: 260px;">
            <canvas id="regChart"></canvas>
          </div>
          <div id="regMsg" class="msg"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8002";
    let segChart = null;
    let regChart = null;
    let lastSegments = null;
    let lastRegression = null;

    function setMsg(id, text, ok = true) {
      const el = document.getElementById(id);
      el.textContent = text || "";
      el.className = "msg" + (text ? (ok ? " ok" : " bad") : "");
    }

    function downloadJSON(filename, data) {
      if (!data) return;
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function renderTable(containerId, columns, rows, headerLabels) {
      const wrap = document.getElementById(containerId);
      if (!rows || rows.length === 0) {
        wrap.innerHTML = `<div class="empty-hint">暂无数据</div>`;
        return;
      }
      const labels = headerLabels && headerLabels.length === columns.length ? headerLabels : columns;
      let html = `<div class="table-wrap"><table class="table"><thead><tr>`;
      labels.forEach(l => html += `<th>${l}</th>`);
      html += `</tr></thead><tbody>`;
      rows.forEach(r => {
        html += `<tr>`;
        columns.forEach(c => html += `<td>${(r[c] ?? "")}</td>`);
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;
      wrap.innerHTML = html;
    }

    async function loadAnomalies() {
      try {
        setMsg("anomalyMsg", "正在检测异常记录…");
        const z = document.getElementById("zInput").value;
        const top = document.getElementById("topInput").value;
        const res = await fetch(`${API_BASE}/ml/anomalies?z=${encodeURIComponent(z)}&top=${encodeURIComponent(top)}`);
        const data = await res.json();

        const kpi = document.getElementById("anomalyKpi");
        kpi.innerHTML = `
          <div class="kpi-box"><div class="label">金额均值</div><div class="value">${Number(data.mean || 0).toFixed(2)}</div></div>
          <div class="kpi-box"><div class="label">金额标准差</div><div class="value">${Number(data.std || 0).toFixed(2)}</div></div>
          <div class="kpi-box"><div class="label">异常条数</div><div class="value">${(data.anomalies || []).length}</div></div>
        `;

        const rows = data.anomalies || [];
        const cols = ["投资编号", "客户编号", "产品编号", "投资金额", "投资期限", "购买时间", "redeemed", "zscore"];
        document.getElementById("anomalyTableWrap").innerHTML = `<div id="anomalyTable" class="table-wrap scroll-x"></div>`;
        renderTable("anomalyTable", cols, rows);
        setMsg("anomalyMsg", "检测完成：已按 |z| 从高到低展示异常记录。", true);
      } catch (e) {
        setMsg("anomalyMsg", "请求失败：" + e.message, false);
      }
    }

    async function loadSegments() {
      try {
        setMsg("segMsg", "正在生成客户分群…");
        const k = document.getElementById("kInput").value;
        const res = await fetch(`${API_BASE}/ml/segments?k=${encodeURIComponent(k)}`);
        const data = await res.json();
        lastSegments = data;

        const profile = data.profile || [];
        console.log(data.profile)
        const segNames = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
        const segLabel = (id) => (id >= 0 && id < segNames.length ? "分群" + segNames[id] : "分群" + (id + 1));
        const labels = profile.map(p => segLabel(p.segment_id));
        const counts = profile.map(p => p.count || 0);

        const ctx = document.getElementById("segChart").getContext("2d");
        if (segChart) segChart.destroy();
        segChart = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [{
              label: "客户数",
              data: counts,
              backgroundColor: "rgba(88, 166, 255, 0.6)",
              borderColor: "rgba(88, 166, 255, 0.9)",
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, grid: { color: "rgba(99, 179, 237, 0.12)" }, ticks: { color: "#8b9cb8" } },
              x: { grid: { display: false }, ticks: { color: "#8b9cb8" } }
            }
          }
        });

        const wrap = document.getElementById("segProfileWrap");
        wrap.innerHTML = `<div id="segProfile" class="table-wrap scroll-x"></div>`;
        const cols = ["segment_id", "count", "avg_times", "avg_amount", "avg_duration", "avg_products", "avg_per_order"];
        const headers = ["分群编号", "客户数", "平均投资次数", "平均投资金额", "平均投资期限", "平均产品数", "笔均金额"];
        const fmt = (v) => (typeof v === "number" && !Number.isInteger(v) ? v.toFixed(2) : v);
        const profileFmt = profile.map(p => { const r = {}; cols.forEach((c, i) => r[c] = fmt(p[c])); return r; });
        renderTable("segProfile", cols, profileFmt, headers);
        setMsg("segMsg", `分群完成：已生成 k=${data.k} 的客户分群与画像。`, true);
      } catch (e) {
        setMsg("segMsg", "请求失败：" + e.message, false);
      }
    }

    async function loadRegression() {
      try {
        setMsg("regMsg", "正在训练模型并生成预测…");
        const res = await fetch(`${API_BASE}/ml/regression`);
        const data = await res.json();
        lastRegression = data;

        const coef = data.coef || {};
        const r2 = Number(data.r2 || 0);
        const kpi = document.getElementById("regKpi");
        kpi.innerHTML = `
          <div class="kpi-box"><div class="label">R²</div><div class="value">${r2.toFixed(3)}</div></div>
          <div class="kpi-box"><div class="label">期限系数</div><div class="value">${Number(coef["投资期限"] ?? 0).toFixed(4)}</div></div>
          <div class="kpi-box"><div class="label">收益率系数</div><div class="value">${Number(coef["日收益率"] ?? 0).toFixed(4)}</div></div>
        `;

        const samples = data.samples || [];
        const actual = samples.map(s => Number(s["投资金额"] ?? 0));
        const pred = samples.map(s => Number(s["预测投资金额"] ?? 0));

        const lo = actual.length ? Math.min(Math.min(...actual), Math.min(...pred), 0) : 0;
        const hi = actual.length ? Math.max(Math.max(...actual), Math.max(...pred)) + 1 : 1;
        const idealLine = [{ x: lo, y: lo }, { x: hi, y: hi }];

        const ctx = document.getElementById("regChart").getContext("2d");
        if (regChart) regChart.destroy();
        regChart = new Chart(ctx, {
          type: "scatter",
          data: {
            datasets: [
              {
                label: "实际 vs 预测",
                data: actual.map((a, i) => ({ x: a, y: pred[i] })),
                backgroundColor: "rgba(63, 185, 80, 0.55)",
                borderColor: "rgba(63, 185, 80, 0.9)"
              },
              {
                label: "y = x（理想线）",
                data: idealLine,
                showLine: true,
                borderColor: "rgba(255, 180, 80, 0.95)",
                borderWidth: 2,
                borderDash: [6, 4],
                pointRadius: 0,
                pointHoverRadius: 0
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: true, labels: { color: "#8b9cb8" } } },
            scales: {
              x: { title: { display: true, text: "实际投资金额", color: "#8b9cb8" }, grid: { color: "rgba(99, 179, 237, 0.12)" }, ticks: { color: "#8b9cb8" } },
              y: { title: { display: true, text: "预测投资金额", color: "#8b9cb8" }, grid: { color: "rgba(99, 179, 237, 0.12)" }, ticks: { color: "#8b9cb8" } }
            }
          }
        });
        setMsg("regMsg", "训练完成：已返回系数、R² 及前 50 条样本预测。", true);

      }
    }
